---
layout: default
title: Posts
---

<div class="home">
    <table class="posts">
        <tbody>
            {% for post in collections.posts %}
            <tr><td>{{ post.data.displayDate }}</td><td><a href="{{ post.url | prepend: site.baseurl }}">{{ post.data.title }}</a></td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
